document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x 22px 36px}\n  .field-input{width:100%;border:1px solid #E5E5E1;border-radius:10px;padding:12px 14px;font-size:14.5px;color:#0B0B0C;background:#fff}\n  .form-grid{display:flex;flex-direction:column;gap:14px}\n  @media(min-width:520px){ .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px} .form-grid .full{grid-column:1/-1} }\n  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n  @media(min-width:720px){ .kpi-grid{grid-template-columns:repeat(4,1fr);gap:16px} .dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:32px} }\n  @media(min-width:720px){\n    .container{padding:0 40px}\n    .block{max-width:1120px;margin:28px auto 0;border-radius:24px;padding:52px 52px 56px}\n    .hero-h1{font-size:60px;letter-spacing:-1.7px}\n    .hero-desc{font-size:18px}\n    .search-fields{flex-direction:row;gap:16px}\n    .search-fields > div{flex:1}\n    .results-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}\n    .footer-block{max-width:1120px;margin:0 auto;border-radius:24px;padding:56px}\n  }\n  @media(min-width:860px){\n    .nav-links{display:flex;gap:22px;align-items:center}\n  }\n  @media(min-width:1120px){\n    .results-grid{grid-template-columns:1fr 1fr 1fr}\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<!-- LOGIN -->\n<sc-if value=\"{{ notAuthed }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#F4F4F1\">\n    <div style=\"width:100%;max-width:400px;background:#fff;border:1px solid #E5E5E1;border-radius:20px;padding:34px 28px\">\n      <div style=\"width:36px;height:36px;border-radius:9px;background:#0B0B0C;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px\">AP<\u002Fdiv>\n      <div class=\"mono\" style=\"font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55;margin-top:16px\">Digital Slide Library<\u002Fdiv>\n      <h1 style=\"font-size:24px;font-weight:600;letter-spacing:-.4px;margin-top:8px\">เข้าสู่ระบบ<\u002Fh1>\n      <p style=\"font-size:13.5px;opacity:.65;margin-top:6px;line-height:1.5\">ใช้บัญชีเดียวกันสำหรับทุกคน<\u002Fp>\n\n      <div style=\"margin-top:22px;display:flex;flex-direction:column;gap:14px\">\n        <div>\n          <div class=\"mono\" style=\"font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.55;margin-bottom:6px\">Username<\u002Fdiv>\n          <input class=\"field-input\" value=\"{{ loginUser }}\" sc-camel-on-change=\"{{ onLoginUser }}\" placeholder=\"patho\">\n        <\u002Fdiv>\n        <div>\n          <div class=\"mono\" style=\"font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.55;margin-bottom:6px\">Password<\u002Fdiv>\n          <input class=\"field-input\" type=\"password\" value=\"{{ loginPass }}\" sc-camel-on-change=\"{{ onLoginPass }}\" placeholder=\"••••••••\">\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"color:#C4364C;font-size:13px;font-weight:500\">{{ loginError }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <button sc-camel-on-click=\"{{ onLoginSubmit }}\" style=\"margin-top:6px;background:#0B0B0C;color:#fff;font-weight:500;font-size:15px;padding:13px;border:none;border-radius:50px;cursor:pointer\">เข้าสู่ระบบ<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- MAIN APP -->\n<sc-if value=\"{{ authed }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"min-height:100vh;padding-bottom:56px\">\n\n  <div style=\"position:sticky;top:0;z-index:20;background:#FFFFFF;border-bottom:1px solid #E5E5E1\">\n    <div class=\"container\" style=\"height:60px;display:flex;align-items:center;justify-content:space-between\">\n      <div style=\"display:flex;align-items:center;gap:11px\">\n        <div style=\"width:32px;height:32px;border-radius:8px;background:#0B0B0C;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:12px;letter-spacing:.5px\">AP<\u002Fdiv>\n        <div style=\"font-weight:600;font-size:15px;letter-spacing:-.2px\">Digital Slide Library<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:16px\">\n        <div class=\"nav-links\">\n          <span style=\"font-size:13.5px;opacity:.6\">เข้าใช้งานโดย <b style=\"opacity:1;color:#0B0B0C\">{{ identity }}<\u002Fb><\u002Fspan>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onLogout }}\" style=\"background:transparent;border:1px solid #E5E5E1;color:#0B0B0C;font-weight:500;font-size:13.5px;padding:9px 16px;border-radius:50px;cursor:pointer\">ออกจากระบบ<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"container\" style=\"padding-top:18px\">\n    <div style=\"display:inline-flex;gap:4px;background:#F4F4F1;padding:4px;border-radius:50px\">\n      <button sc-camel-on-click=\"{{ onShowSearch }}\" style=\"{{ tabSearchStyle }}\">ค้นหาสไลด์<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onShowDashboard }}\" style=\"{{ tabDashboardStyle }}\">แดชบอร์ด<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isSearchView }}\" hint-placeholder-val=\"{{ true }}\">\n  <div class=\"block\" style=\"background:{{ blockColor }}\">\n    <div class=\"hero-grid\">\n      <div>\n        <div class=\"mono\" style=\"font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;opacity:.62\">Digital Slide Library<\u002Fdiv>\n        <h1 class=\"hero-h1\" style=\"margin-top:14px\">ค้นหาสไลด์ดิจิทัล<\u002Fh1>\n        <p class=\"hero-desc\">ค้นหาแบบละเอียด — กรอก Organ/Tissue และ Diagnosis พร้อมกันเพื่อกรองผลลัพธ์ให้แม่นยำขึ้น<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div class=\"search-fields\">\n          <div>\n            <div class=\"mono\" style=\"font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55;margin-bottom:9px\">Surgical No / Block<\u002Fdiv>\n            <input class=\"field-input\" style=\"height:52px;border:1px solid rgba(0,0,0,.06)\" value=\"{{ idQuery }}\" sc-camel-on-change=\"{{ onIdQuery }}\" placeholder=\"เช่น S69-01234 หรือ A1\">\n          <\u002Fdiv>\n          <div>\n            <div class=\"mono\" style=\"font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55;margin-bottom:9px\">Organ / Tissue<\u002Fdiv>\n            <input class=\"field-input\" style=\"height:52px;border:1px solid rgba(0,0,0,.06)\" list=\"organlist\" value=\"{{ organQuery }}\" sc-camel-on-change=\"{{ onOrganQuery }}\" placeholder=\"เช่น Breast, Lung…\">\n            <datalist id=\"organlist\">\n              <sc-for list=\"{{ organSuggestions }}\" as=\"o\" hint-placeholder-count=\"6\"><option value=\"{{ o }}\"><\u002Foption><\u002Fsc-for>\n            <\u002Fdatalist>\n          <\u002Fdiv>\n          <div>\n            <div class=\"mono\" style=\"font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55;margin-bottom:9px\">Diagnosis<\u002Fdiv>\n            <input class=\"field-input\" style=\"height:52px;border:1px solid rgba(0,0,0,.06)\" value=\"{{ dxQuery }}\" sc-camel-on-change=\"{{ onDxQuery }}\" placeholder=\"เช่น carcinoma, adenoma…\">\n          <\u002Fdiv>\n          <div>\n            <div class=\"mono\" style=\"font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55;margin-bottom:9px\">ปีที่สแกน<\u002Fdiv>\n            <sc-raw-select class=\"field-input\" style=\"height:52px;border:1px solid rgba(0,0,0,.06)\" value=\"{{ searchYear }}\" sc-camel-on-change=\"{{ onSearchYear }}\">\n              <sc-for list=\"{{ searchYearOptions }}\" as=\"sy\" hint-placeholder-count=\"2\">\n                <option value=\"{{ sy }}\">{{ sy }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasFilter }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ clearAll }}\" class=\"mono\" style=\"margin-top:12px;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;background:#0B0B0C;color:#fff;border:none;border-radius:50px;padding:8px 14px;cursor:pointer\">ล้างตัวกรอง<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"container\" style=\"padding-top:36px;padding-bottom:44px\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap\">\n      <div style=\"font-weight:600;font-size:20px;letter-spacing:-.3px\">ผลการค้นหา<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <div class=\"mono\" style=\"font-size:12px;letter-spacing:.5px;opacity:.6\">{{ countLabel }}<\u002Fdiv>\n        <sc-if value=\"{{ gasBadge }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"mono\" style=\"font-size:11px;letter-spacing:.3px;opacity:.5\">{{ gasBadge }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ onOpenAdd }}\" style=\"background:#0B0B0C;color:#fff;font-weight:500;font-size:13.5px;padding:9px 16px;border-radius:50px;border:none;cursor:pointer\">+ เพิ่มเคสใหม่<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align:center;padding:56px 20px;border:1px dashed #E0E0DB;border-radius:16px\">\n        <div style=\"font-size:16px;font-weight:500\">ไม่พบเคสที่ตรงกับตัวกรอง<\u002Fdiv>\n        <div style=\"font-size:14px;opacity:.6;margin-top:6px\">ลองปรับ Organ/Tissue หรือคำค้น Diagnosis<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div class=\"results-grid\">\n      <sc-for list=\"{{ results }}\" as=\"r\" hint-placeholder-count=\"6\">\n        <div style=\"border:1px solid #E5E5E1;border-radius:16px;overflow:hidden;background:#fff\">\n          <div sc-camel-on-click=\"{{ r.onToggle }}\" style=\"padding:18px 18px 16px;cursor:pointer\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n              <span class=\"mono\" style=\"font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;background:#F4F4F1;padding:5px 10px;border-radius:50px\">{{ r.organLabel }}<\u002Fspan>\n              <span class=\"mono\" style=\"font-size:11px;letter-spacing:.4px;opacity:.55;flex:0 0 auto\">{{ r.dateScanned }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ r.hasBadges }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px\">\n                <sc-if value=\"{{ r.slideCount }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span class=\"mono\" style=\"font-size:10.5px;letter-spacing:.6px;background:#0B0B0C;color:#fff;padding:5px 10px;border-radius:50px\">{{ r.slideCount }} สไลด์<\u002Fspan>\n                <\u002Fsc-if>\n                <span style=\"flex:1\"><\u002Fspan>\n                <sc-if value=\"{{ r.repeatScan }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span class=\"mono\" style=\"font-size:10.5px;letter-spacing:.6px;background:#C4364C;color:#fff;padding:5px 10px;border-radius:50px\">Scan ซ้ำ{{ r.rescanSuffix }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"font-size:19px;line-height:1.3;font-weight:600;letter-spacing:-.3px;margin-top:12px;text-wrap:pretty\">{{ r.diagnosis }}<\u002Fdiv>\n            <div class=\"mono\" style=\"display:flex;align-items:center;gap:12px;margin-top:11px;font-size:11.5px;letter-spacing:.3px;opacity:.72\">\n              <span>{{ r.surgicalNo }}<\u002Fspan><span style=\"opacity:.4\">·<\u002Fspan><span>Block {{ r.block }}<\u002Fspan><span style=\"opacity:.4\">·<\u002Fspan><span style=\"{{ r.statusStyle }}\">{{ r.status }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:13.5px;opacity:.7;margin-top:7px\">พยาธิแพทย์ · {{ r.pathologist }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ r.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:2px 18px 18px;animation:popin .18s ease\">\n              <div style=\"border-top:1px solid #EFEFEB;padding-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px 12px\">\n                <div><div class=\"mono\" style=\"font-size:9.5px;letter-spacing:1px;text-transform:uppercase;opacity:.5\">Organ/Tissue<\u002Fdiv><div style=\"font-size:14px;font-weight:500;margin-top:4px\">{{ r.organLabel }}<\u002Fdiv><\u002Fdiv>\n                <div><div class=\"mono\" style=\"font-size:9.5px;letter-spacing:1px;text-transform:uppercase;opacity:.5\">Surgical No / Block<\u002Fdiv><div class=\"mono\" style=\"font-size:14px;font-weight:500;margin-top:4px\">{{ r.surgicalNo }} · {{ r.block }}<\u002Fdiv><\u002Fdiv>\n                <div><div class=\"mono\" style=\"font-size:9.5px;letter-spacing:1px;text-transform:uppercase;opacity:.5\">วันที่ส่งชิ้นเนื้อ<\u002Fdiv><div style=\"font-size:14px;font-weight:500;margin-top:4px\">{{ r.dateSubmitted }}<\u002Fdiv><\u002Fdiv>\n                <div><div class=\"mono\" style=\"font-size:9.5px;letter-spacing:1px;text-transform:uppercase;opacity:.5\">วันที่สแกน<\u002Fdiv><div style=\"font-size:14px;font-weight:500;margin-top:4px\">{{ r.dateScanned }}<\u002Fdiv><\u002Fdiv>\n                <div><div class=\"mono\" style=\"font-size:9.5px;letter-spacing:1px;text-transform:uppercase;opacity:.5\">สถานะ<\u002Fdiv><div style=\"font-size:14px;font-weight:500;margin-top:4px;{{ r.statusStyle }}\">{{ r.status }}<\u002Fdiv><\u002Fdiv>\n                <div><div class=\"mono\" style=\"font-size:9.5px;letter-spacing:1px;text-transform:uppercase;opacity:.5\">Slide IHC<\u002Fdiv><div style=\"font-size:14px;font-weight:500;margin-top:4px\">{{ r.ihcText }}<\u002Fdiv><\u002Fdiv>\n                <div><div class=\"mono\" style=\"font-size:9.5px;letter-spacing:1px;text-transform:uppercase;opacity:.5\">Slide ย้อมพิเศษ<\u002Fdiv><div style=\"font-size:14px;font-weight:500;margin-top:4px\">{{ r.specialText }}<\u002Fdiv><\u002Fdiv>\n                <div><div class=\"mono\" style=\"font-size:9.5px;letter-spacing:1px;text-transform:uppercase;opacity:.5\">พยาธิแพทย์<\u002Fdiv><div style=\"font-size:14px;font-weight:500;margin-top:4px\">{{ r.pathologist }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ r.note }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:12px\"><div class=\"mono\" style=\"font-size:9.5px;letter-spacing:1px;text-transform:uppercase;opacity:.5\">หมายเหตุ<\u002Fdiv><div style=\"font-size:14px;margin-top:4px\">{{ r.note }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"margin-top:14px;padding-top:14px;border-top:1px solid #EFEFEB;font-size:12px;opacity:.6;line-height:1.7\">\n                <div>บันทึกโดย {{ r.recordedBy }} · {{ r.createdAtDate }}<\u002Fdiv>\n                <sc-if value=\"{{ r.lastEditedBy }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div>แก้ไขล่าสุดโดย {{ r.lastEditedBy }} · {{ r.lastEditedAtDate }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;gap:10px;margin-top:16px\">\n                <button sc-camel-on-click=\"{{ r.onEdit }}\" style=\"flex:1;font-size:14.5px;font-weight:500;padding:12px;border-radius:50px;border:1px solid #0B0B0C;background:#fff;color:#0B0B0C;cursor:pointer\">แก้ไขข้อมูล<\u002Fbutton>\n                <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button sc-camel-on-click=\"{{ r.onDelete }}\" style=\"flex:0 0 auto;font-size:14.5px;font-weight:500;padding:12px 18px;border-radius:50px;border:1px solid #F3C6CE;background:#FDECEF;color:#C4364C;cursor:pointer\">ลบ<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasMore }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;justify-content:center;margin-top:24px\">\n        <button sc-camel-on-click=\"{{ onLoadMore }}\" style=\"background:#F4F4F1;color:#0B0B0C;font-weight:500;font-size:14px;padding:11px 22px;border-radius:50px;border:none;cursor:pointer\">แสดงเพิ่มเติม ({{ shownCount }} จาก {{ totalCount }})<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isDashboardView }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"container\" style=\"padding-top:16px;padding-bottom:44px\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px\">\n      <div style=\"font-weight:600;font-size:20px;letter-spacing:-.3px\">แดชบอร์ดภาพรวม<\u002Fdiv>\n      <sc-raw-select class=\"field-input\" style=\"width:auto;min-width:120px\" value=\"{{ dashYear }}\" sc-camel-on-change=\"{{ onDashYear }}\">\n        <sc-for list=\"{{ yearOptions }}\" as=\"y\" hint-placeholder-count=\"2\">\n          <option value=\"{{ y }}\">{{ y }}<\u002Foption>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-select>\n    <\u002Fdiv>\n\n    <div class=\"kpi-grid\">\n      <div style=\"border:1px solid #E5E5E1;background:#F4F4F1;border-radius:16px;padding:18px\">\n        <div class=\"mono\" style=\"font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.6\">เคสทั้งหมด<\u002Fdiv>\n        <div style=\"font-size:28px;font-weight:600;margin-top:8px\">{{ totalCases }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E5E5E1;background:#F4F4F1;border-radius:16px;padding:18px\">\n        <div class=\"mono\" style=\"font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.6\">จำนวนชนิด Organ<\u002Fdiv>\n              <sc-raw-select class=\"field-input\" style=\"flex:1\" value=\"{{ specialPick }}\" sc-camel-on-change=\"{{ onSpecialPick }}\">\n                <option value=\"\">— เลือกย้อมพิเศษ —<\u002Foption>\n                <sc-for list=\"{{ specialOptions }}\" as=\"sp\" hint-placeholder-count=\"6\"><option value=\"{{ sp }}\">{{ sp }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <input type=\"number\" min=\"1\" class=\"field-input\" style=\"width:80px\" value=\"{{ specialPickCount }}\" sc-camel-on-change=\"{{ onSpecialPickCount }}\">\n              <button sc-camel-on-click=\"{{ onAddSpecial }}\" style=\"padding:0 16px;border-radius:10px;border:none;background:#0B0B0C;color:#fff;font-size:14px;cursor:pointer\">+ เพิ่ม<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasSpecialItems }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:10px\">\n                <sc-for list=\"{{ specialRows }}\" as=\"row2\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;background:#F4F4F1;border-radius:8px;padding:8px 12px;font-size:13.5px\">\n                    <span>{{ row2.name }} <span class=\"mono\" style=\"opacity:.6\">× {{ row2.count }}<\u002Fspan><\u002Fspan>\n                    <button sc-camel-on-click=\"{{ row2.onRemove }}\" style=\"background:none;border:none;color:#0B0B0C;opacity:.5;cursor:pointer;font-size:15px\">✕<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div class=\"full\">\n            <div class=\"mono\" style=\"font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;opacity:.6;margin-bottom:8px\">สถานะ *<\u002Fdiv>\n            <div style=\"display:flex;gap:20px\">\n              <label style=\"display:flex;align-items:center;gap:8px;font-size:14.5px;cursor:pointer\">\n                <input type=\"checkbox\" style=\"width:18px;height:18px\" checked=\"{{ form.scanned }}\" sc-camel-on-change=\"{{ onToggleScanned }}\"> สแกนแล้ว\n              <\u002Flabel>\n              <label style=\"display:flex;align-items:center;gap:8px;font-size:14.5px;cursor:pointer;color:#C17817\">\n                <input type=\"checkbox\" style=\"width:18px;height:18px\" checked=\"{{ form.archived }}\" sc-camel-on-change=\"{{ onToggleArchived }}\"> เก็บเข้าคลัง\n              <\u002Flabel>\n              <label style=\"display:flex;align-items:center;gap:8px;font-size:14.5px;cursor:pointer;color:#C4364C\">\n                <input type=\"checkbox\" style=\"width:18px;height:18px\" checked=\"{{ form.repeatScan }}\" sc-camel-on-change=\"{{ onToggleRepeat }}\"> Scan ซ้ำ\n              <\u002Flabel>\n            <\u002Fdiv>\n            <sc-if value=\"{{ form.repeatScan }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:14px;background:#FDECEF;border:1px solid #F3C6CE;border-radius:12px;padding:14px 16px\">\n                <div class=\"mono\" style=\"font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#C4364C;margin-bottom:8px\">วันที่สแกนซ้ำ<\u002Fdiv>\n                <input type=\"date\" class=\"field-input\" style=\"max-width:220px;border-color:#F3C6CE\" value=\"{{ form.rescanDate }}\" sc-camel-on-change=\"{{ onField_rescanDate }}\">\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div><div class=\"mono\" style=\"font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;opacity:.6;margin-bottom:6px\">พยาธิแพทย์ *<\u002Fdiv>\n            <sc-raw-select class=\"field-input\" required=\"\" value=\"{{ form.pathologist }}\" sc-camel-on-change=\"{{ onField_pathologist }}\">\n              <option value=\"\">— เลือกพยาธิแพทย์ —<\u002Foption>\n              <sc-for list=\"{{ pathologistOptions }}\" as=\"p\" hint-placeholder-count=\"4\"><option value=\"{{ p }}\">{{ p }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div><div class=\"mono\" style=\"font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;opacity:.6;margin-bottom:6px\">เจ้าหน้าที่ผู้บันทึก *<\u002Fdiv>\n            <sc-raw-select class=\"field-input\" required=\"\" value=\"{{ form.recorder }}\" sc-camel-on-change=\"{{ onField_recorder }}\">\n              <option value=\"\">— เลือกเจ้าหน้าที่ —<\u002Foption>\n              <sc-for list=\"{{ staffOptions }}\" as=\"st\" hint-placeholder-count=\"4\"><option value=\"{{ st }}\">{{ st }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div class=\"full\"><div class=\"mono\" style=\"font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;opacity:.6;margin-bottom:6px\">หมายเหตุ<\u002Fdiv><textarea class=\"field-input\" style=\"min-height:56px;resize:vertical\" value=\"{{ form.note }}\" sc-camel-on-change=\"{{ onField_note }}\" placeholder=\"ไม่บังคับ\"><\u002Ftextarea><\u002Fdiv>\n          <div class=\"full\" style=\"font-size:12.5px;opacity:.55\">เข้าใช้งานในนามบัญชี: <b>{{ identity }}<\u002Fb><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ formError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;background:#FDECEF;border:1px solid #F3C6CE;color:#C4364C;font-size:13.5px;font-weight:500;border-radius:12px;padding:12px 14px\">{{ formError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin-top:20px;flex:0 0 auto\">\n          <button sc-camel-on-click=\"{{ onCloseForm }}\" style=\"flex:1;font-size:15px;font-weight:500;padding:13px;border-radius:50px;border:1px solid #E5E5E1;background:#fff;color:#0B0B0C;cursor:pointer\">ยกเลิก<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onSaveForm }}\" style=\"flex:1;font-size:15px;font-weight:500;padding:13px;border-radius:50px;border:none;background:#0B0B0C;color:#fff;cursor:pointer\">บันทึก<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:900},&quot;blockColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D9F26E&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;,&quot;options&quot;:[[&quot;#D9F26E&quot;,&quot;#E3DEFF&quot;,&quot;#F5ECDA&quot;,&quot;#CFEFDE&quot;,&quot;#FBD9E3&quot;]]},&quot;gasUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://script.google.com/macros/s/AKfycbzG933Vo88oppYlIaTIqK0YbGMRPGOY2F_hZhKG1DzO0o9Ac7wjDdCy3EDQ7hvjvYsnYA/exec&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Data source&quot;}}\">\nconst STAFF = ['สุดารัตน์','ณัฐสุดา','เบญจมาศ','ธนัฐฐา','กนกพร','พัชรี'];\nconst PATHOLOGISTS = ['อ.ปารมี','อ.อนุพงศ์','อ.คณิตา','อ.คเณศ','อ.จารุกิตติ์','อ.ชยุต','อ.สุชญา','อ.วรัชยา','อ.ปัณณวิชญ์','อ.ฐิตวันต์','นพ.สุขุมพงศ์'];\nconst EMPTY_FORM = { surgicalNo:'', block:'', organ1:'', organ2:'', diagnosis:'', dateSubmitted:'', dateScanned:'', scanned:false, archived:false, repeatScan:false, rescanDate:'', pathologist:'', note:'', recorder:'', ihcItems:[], specialItems:[], purpose:'', purposeOther:'' };\nconst PURPOSE_OPTIONS = ['Interesting case','Conference','การเรียนการสอน','อื่นๆ'];\nfunction deriveStatus(f){ return f.archived ? 'จัดเก็บเข้าคลังแล้ว' : (f.scanned ? 'สแกนแล้ว' : 'รอสแกน'); }\nconst IHC_LIST = ['34BetaE12','ACTH','AE1/AE3','AFP','ALK (D5F3)','ALK Protein','alpha-Inhibin','ATRX','B-catenin','B-hCG','Bcl2','Bcl6','BCOR','BOB.1','C-kit','c-Myc','C4d','C5b-9','Caldesmon','Calret','CAM 5.2','CD1a','CD2','CD3','CD4','CD5','CD7','CD8','CD10','CD15','CD19','CD20','CD21','CD23','CD30','CD31','CD33','CD34','CD38','CD43','CD56','CD57','CD61','CD68 KP1','CD68 PG-M1','CD71','CD79a','CD99','CD123','CD138','CDK4','CDX-2','CEA','CK5/6','CK7','CK19','CK20','CMG','CMV','CXCL13','CyclinD1','CYP11B2','D2-40','Desmin','DOG1','E-cad','EBER','EMA','ER','ERG','Factor-8','GATA3','GCDFP-15','GFAP','Glutamine','Glycophorin A','Glypican-3','GranzymeB','H.pylori','H3.3G34W','H3.3K27M','H3F3A','H3K27me3','Hepatocyte','HER2','HER2DISH','HHV-8','HMB45','IDH1 R132H','IgA','IgG','IgG4','IgM','INI1','Kappa','Ki-67','Lambda','LCA','LMP','Mammaglobin','MDM2','Melan-A','MLH1','MOC31','MPO','MSA','MSH2','MSH6','MUM-1','MyoD1','Myogenin','NapsinA','NKX2.2','NKX3.1','NSE','OCT-2','OCT3/4','OLIG2','P16','P27','P40','P53','P63','PAX-8','PAX5','PD-L1','PD1','Pit1','PLAP','PSM2','PR','Prolactin','PSA','ROS-1','S-100','SALL4','SATB2','SDHB','SF-1','SMA','SOX-10','SOX-11','SS18-SSX','SSTR-2a','STAT-6','Synapto','T-pit','TCR BF1','TCR-Delta','TdT','TFE3','Thyroglobulin','TIA-1','TIMP-2','TLE1','TSH','TTF1','Uroplakin II','Villin','Vimentin','WT-1'].sort((a,b)=>a.localeCompare(b));\nconst SPECIAL_STAIN_LIST = ['AFB','Alc. Blue','Bilirubin','Bleaching','Congo red','Copper','COX','COX/SDH','Crystal V.','Deeper cut 1','Deeper cut 2','Deeper cut 3','Elastic','Fite','Floater','Fontana','Giemsa','GMS','Gram','H&E','Iron','Masson','Modified Gomori Trichrome','Mucin','NADH','Oil Red-O','PAMS','PAS','PAS-D','Recut 1','Recut 2','Recut 3','Reticulin','SDH','Spirochete','TCR/IgH rearrangement'].sort((a,b)=>a.localeCompare(b));\n\nclass Component extends DCLogic {\n  state = {\n    authed:false, loginUser:'', loginPass:'', loginIdentity:'', loginError:'', identity:null,\n    organQuery:'', dxQuery:'', idQuery:'', searchYear:'ALL', repeatOnly:false, expanded:null, visibleCount:12,\n    view:'search', dashYear:'ALL',\n    showForm:false, editingId:null, form:{ ...EMPTY_FORM }, ihcPick:'', ihcPickCount:'1', specialPick:'', specialPickCount:'1',\n    slides: []\n  };\n\n  componentDidMount(){\n    try {\n      const saved = localStorage.getItem('ap_digitalslide_identity');\n      if (saved) {\n        this.setState({ authed:true, identity: saved, isAdmin: localStorage.getItem('ap_digitalslide_admin') === '1' });\n      }\n    } catch(e) {}\n    this.loadFromGas();\n  }\n\n  loadFromGas(){\n    const url = this.props.gasUrl;\n    if (!url) return;\n    this.setState({ gasStatus:'loading' });\n    fetch(url + (url.includes('?') ? '&' : '?') + 'action=list')\n      .then(r => r.json())\n      .then(d => {\n        const slides = (d.records || []).map(r => ({\n          id:r.id, surgicalNo:r.surgicalNo, block:r.block, organ1:r.organ1, organ2:r.organ2 || '',\n          diagnosis:r.diagnosis, pathologist:r.pathologist, dateSubmitted:this.dateOnly(r.dateSubmitted), dateScanned:this.dateOnly(r.dateScanned),\n          ihcItems: this.parseItems(r.ihcItems), specialItems: this.parseItems(r.specialItems), repeatScan: r.repeatScan === true || r.repeatScan === 'TRUE' || r.repeatScan === '1', rescanDate: this.dateOnly(r.rescanDate) || '',\n          status:r.status, note:r.note || '', recordedBy:r.recordedBy, createdAt:r.timestamp,\n          lastEditedBy:r.lastEditedBy || null, lastEditedAt:r.lastEditedAt || null\n        })).reverse();\n        this.setState({ slides, gasStatus:'ready' });\n      })\n      .catch(() => this.setState({ gasStatus:'error' }));\n  }\n\n  tabStyle(active){\n    return active\n      ? 'padding:9px 18px;border-radius:50px;border:none;background:#0B0B0C;color:#fff;font-weight:500;font-size:13.5px;cursor:pointer;'\n      : 'padding:9px 18px;border-radius:50px;border:none;background:transparent;color:#0B0B0C;font-weight:500;font-size:13.5px;cursor:pointer;opacity:.55;';\n  }\n\n  parseDate(str){\n    if (!str) return null;\n    const iso = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(str);\n    if (iso) return { year:+iso[1], month:+iso[2]-1 };\n    const yearMatch = /(\\d{4})/.exec(str);\n    if (!yearMatch) return null;\n    let year = +yearMatch[1];\n    if (year > 2400) year -= 543;\n    const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];\n    const mi = MONTHS.findIndex(m => str.includes(m));\n    return { year, month: mi >= 0 ? mi : 0 };\n  }\n\n  computeDashboard(){\n    const withDate = this.state.slides.map(s => ({ ...s, _d: this.parseDate(s.dateScanned) }));\n    const years = Array.from(new Set(withDate.filter(s => s._d).map(s => s._d.year))).sort((a,b)=>b-a);\n    const dashYear = this.state.dashYear;\n    const filtered = dashYear === 'ALL' ? withDate : withDate.filter(s => s._d && String(s._d.year) === String(dashYear));\n\n    const organCounts = {};\n    filtered.forEach(s => { [s.organ1, s.organ2].forEach(o => { if (o) organCounts[o] = (organCounts[o]||0) + 1; }); });\n    const organArr = Object.entries(organCounts).map(([name,count]) => ({name,count})).sort((a,b)=>b.count-a.count);\n    const maxOrgan = organArr[0]?.count || 1;\n    const organRows = organArr.map(o => ({\n      name:o.name, count:o.count,\n      barStyle: 'height:22px;border-radius:6px;background:#0B0B0C;width:' + Math.max(4, Math.round(o.count/maxOrgan*100)) + '%'\n    }));\n\n    const statusOrder = ['รอสแกน','สแกนแล้ว','จัดเก็บเข้าคลังแล้ว'];\n    const statusCounts = {};\n    statusOrder.forEach(k => statusCounts[k] = 0);\n    filtered.forEach(s => { statusCounts[s.status] = (statusCounts[s.status]||0) + 1; });\n\n    const MONTH_LABELS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];\n    const monthCounts = new Array(12).fill(0);\n    filtered.forEach(s => { if (s._d) monthCounts[s._d.month]++; });\n    const maxMonth = Math.max(1, ...monthCounts);\n    const monthly = MONTH_LABELS.map((label,i) => ({\n      label, count: monthCounts[i],\n      barStyle: 'width:70%;background:#B7E33B;border-radius:4px 4px 0 0;height:' + Math.max(4, Math.round(monthCounts[i]/maxMonth*110)) + 'px'\n    }));\n\n    const totalIhcCount = filtered.reduce((sum,s) => sum + this.itemsCount(s.ihcItems), 0);\n    const totalSpecialCount = filtered.reduce((sum,s) => sum + this.itemsCount(s.specialItems), 0);\n    const totalSlideCount = totalIhcCount + totalSpecialCount;\n    const workloadMap = {};\n    filtered.forEach(s => {\n      const name = s.recordedBy || 'ไม่ระบุ';\n      if (!workloadMap[name]) workloadMap[name] = { cases:0, ihc:0, special:0 };\n      workloadMap[name].cases++;\n      workloadMap[name].ihc += this.itemsCount(s.ihcItems);\n      workloadMap[name].special += this.itemsCount(s.specialItems);\n    });\n    const staffWorkload = Object.entries(workloadMap).map(([name,v]) => ({ name, ...v, total:v.ihc+v.special })).sort((a,b)=>b.total-a.total);\n    const dotPalette = ['#D9F26E','#8A7FE8','#E8879F','#7FCE9F','#FFB347','#5FB8D6','#E0648F','#9C8CE0'];\n    staffWorkload.forEach((w,i) => { w.dotColor = dotPalette[i % dotPalette.length]; });\n\n    return {\n      yearOptions: ['ALL', ...years],\n      dashYear,\n      totalCases: filtered.length,\n      totalSlideCount, totalIhcCount, totalSpecialCount, staffWorkload,\n      organTypesCount: organArr.length,\n      topOrganName: organArr[0]?.name || '—',\n      topOrganCount: organArr[0]?.count || 0,\n      pendingCount: statusCounts['รอสแกน'] || 0,\n      organRows, noOrganData: organRows.length === 0,\n      statusRows: statusOrder.map(name => ({ name, count: statusCounts[name], dotColor: name==='รอสแกน' ? '#E8879F' : name==='สแกนแล้ว' ? '#7FCE9F' : '#8A7FE8' })),\n      monthly,\n    };\n  }\n\n  requestStyle(done){\n    const base = 'flex:1;font-size:14.5px;font-weight:500;padding:12px;border-radius:50px;border:none;cursor:pointer;';\n    return done ? base + 'background:#F4F4F1;color:#1F8A4C;' : base + 'background:#0B0B0C;color:#fff;';\n  }\n\n  parseItems(v){\n    if (Array.isArray(v)) return v;\n    if (!v) return [];\n    try { const p = JSON.parse(v); return Array.isArray(p) ? p : []; } catch(e) { return []; }\n  }\n  itemsText(items){\n    return (items && items.length) ? items.map(i => i.name+' × '+i.count).join(', ') : '—';\n  }\n  itemsCount(items){\n    return (items||[]).reduce((sum,i) => sum + (parseInt(i.count)||0), 0);\n  }\n\n  dateOnly(v){\n    if (!v) return v;\n    const s = String(v);\n    const slashMatch = /^(\\d{2}\\/\\d{2}\\/\\d{4})/.exec(s);\n    if (slashMatch) return slashMatch[1];\n    const m = /^(\\d{4}-\\d{2}-\\d{2})/.exec(s);\n    if (m) return m[1];\n    const d = new Date(s);\n    if (!isNaN(d)) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\n    return s;\n  }\n\n  now(){\n    const d = new Date();\n    const p = n => String(n).padStart(2,'0');\n    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+p(d.getHours())+':'+p(d.getMinutes());\n  }\n\n  renderVals(){\n    const identityOptions = [\n      ...PATHOLOGISTS.map(n => ({ name:n, label:n+' (พยาธิแพทย์)' })),\n      ...STAFF.map(n => ({ name:n, label:n+' (เจ้าหน้าที่)' })),\n    ];\n\n    if (!this.state.authed) {\n      return {\n        authed:false, notAuthed:true,\n        loginUser:this.state.loginUser, loginPass:this.state.loginPass, loginIdentity:this.state.loginIdentity,\n        loginError:this.state.loginError, identityOptions,\n        onLoginUser:(e)=>this.setState({loginUser:e.target.value}),\n        onLoginPass:(e)=>this.setState({loginPass:e.target.value}),\n        onLoginSubmit:()=>{\n          const u = this.state.loginUser, p = this.state.loginPass;\n          const isAdmin = u === 'admin' && p === '123456';\n          if (!isAdmin && (u !== 'patho' || p !== 'patho1234')) {\n            this.setState({loginError:'Username หรือ Password ไม่ถูกต้อง'}); return;\n          }\n          try {\n            localStorage.setItem('ap_digitalslide_identity', u);\n            localStorage.setItem('ap_digitalslide_admin', isAdmin ? '1' : '0');\n          } catch(e){}\n          this.setState({authed:true, identity:u, isAdmin, loginError:''});\n        },\n      };\n    }\n\n    const blockColor = this.props.blockColor ?? '#D9F26E';\n    const oq = this.state.organQuery.trim().toLowerCase();\n    const dq = this.state.dxQuery.trim().toLowerCase();\n    const idq = this.state.idQuery.trim().toLowerCase();\n    const sy = this.state.searchYear;\n\n    const organSet = new Set();\n    this.state.slides.forEach(s => { if(s.organ1) organSet.add(s.organ1); if(s.organ2) organSet.add(s.organ2); });\n\n    const yearsFound = Array.from(new Set(this.state.slides.map(s => this.parseDate(s.dateScanned)).filter(Boolean).map(d => d.year))).sort((a,b)=>b-a);\n\n    let list = this.state.slides.filter(s => {\n      const organText = (s.organ1+' '+s.organ2).toLowerCase();\n      const okOrgan = oq === '' || organText.includes(oq);\n      const okDx = dq === '' || s.diagnosis.toLowerCase().includes(dq);\n      const d = this.parseDate(s.dateScanned);\n      const okYear = sy === 'ALL' || (d && String(d.year) === String(sy));\n      const okRepeat = !this.state.repeatOnly || !!s.repeatScan;\n      const okId = idq === '' || (s.surgicalNo||'').toLowerCase().includes(idq) || (s.block||'').toLowerCase().includes(idq);\n      return okOrgan && okDx && okYear && okRepeat && okId;\n    });\n\n    const totalCount = list.length;\n    const visible = list.slice(0, this.state.visibleCount);\n    const results = visible.map(s => {\n      return {\n        id:s.id, organLabel: s.organ2 ? (s.organ1+' / '+s.organ2) : s.organ1,\n        diagnosis:s.diagnosis, surgicalNo:s.surgicalNo, block:s.block, status:s.status, statusStyle: s.status === 'จัดเก็บเข้าคลังแล้ว' ? 'color:#C17817;font-weight:600' : '',\n        dateSubmitted:s.dateSubmitted, dateScanned:s.dateScanned, pathologist:s.pathologist,\n        note:s.note, recordedBy:s.recordedBy, createdAt:s.createdAt, createdAtDate:this.dateOnly(s.createdAt),\n        lastEditedBy:s.lastEditedBy, lastEditedAt:s.lastEditedAt, lastEditedAtDate:this.dateOnly(s.lastEditedAt),\n        slideCount: this.itemsCount(s.ihcItems) + this.itemsCount(s.specialItems),\n ue }),\n      onSpecialPick: (e) => this.setState({ specialPick: e.target.value }),\n      onSpecialPickCount: (e) => this.setState({ specialPickCount: e.target.value }),\n      onAddIhc: () => {\n        if (!this.state.ihcPick) return;\n        const item = { name:this.state.ihcPick, count: parseInt(this.state.ihcPickCount)||1 };\n        this.setState(st => ({ form:{ ...st.form, ihcItems:[...st.form.ihcItems, item] }, ihcPick:'', ihcPickCount:'1' }));\n      },\n      onAddSpecial: () => {\n        if (!this.state.specialPick) return;\n        const item = { name:this.state.specialPick, count: parseInt(this.state.specialPickCount)||1 };\n        this.setState(st => ({ form:{ ...st.form, specialItems:[...st.form.specialItems, item] }, specialPick:'', specialPickCount:'1' }));\n      },\n      hasIhcItems: this.state.form.ihcItems.length > 0,\n      ihcRows: this.state.form.ihcItems.map((it,i) => ({ ...it, onRemove: () => this.setState(st => ({ form:{ ...st.form, ihcItems: st.form.ihcItems.filter((_,idx)=>idx!==i) } })) })),\n      hasSpecialItems: this.state.form.specialItems.length > 0,\n      specialRows: this.state.form.specialItems.map((it,i) => ({ ...it, onRemove: () => this.setState(st => ({ form:{ ...st.form, specialItems: st.form.specialItems.filter((_,idx)=>idx!==i) } })) })),\n      onSaveForm: () => {\n        const f = this.state.form;\n        const url = this.props.gasUrl;\n        if (!f.surgicalNo || !f.block || !f.organ1 || !f.diagnosis || !f.dateSubmitted || !f.dateScanned || !f.pathologist || !f.recorder || !f.scanned) {\n          this.setState({ formError: 'กรุณากรอกข้อมูลให้ครบทุกช่อง (ยกเว้น Organ/Tissue 2, หมายเหตุ, IHC และ ย้อมพิเศษ) และระบุสถานะอย่างน้อย \"สแกนแล้ว\"' }); return;\n        }\n        const status = deriveStatus(f);\n        this.setState({ formError: '' });\n        if (this.state.editingId) {\n          const editedAt = this.now();\n          const editId = this.state.editingId;\n          this.setState(st => ({\n
